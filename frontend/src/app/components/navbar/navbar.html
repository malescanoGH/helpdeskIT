<mat-toolbar class="navbar" *ngIf="estaLogueado()">
  <div class="navbar-left">
    <mat-icon class="logo-icon">bug_report</mat-icon>
    <span class="logo-text" routerLink="/dashboard">HelpDesk IT</span>
  </div>

  <div class="navbar-right">
    <button mat-icon-button routerLink="/dashboard" matTooltip="Dashboard">
      <mat-icon>dashboard</mat-icon>
    </button>

    <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
      <mat-icon>account_circle</mat-icon>
      <span class="user-name">{{ usuario?.nombre }}</span>
      <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu" class="dark-menu">
      <button mat-menu-item disabled>
        <mat-icon>email</mat-icon>
        <span>{{ usuario?.email }}</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="cerrarSesion()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
