<div class="dashboard-container">
  <mat-card class="header-card">
    <div class="header-content">
      <div>
        <h1>Mis Proyectos</h1>
        <p>Bienvenido, {{ usuario?.nombre }}</p>
      </div>
      <div class="header-actions">
        <button mat-raised-button color="primary" (click)="showForm = !showForm">
          <mat-icon>add</mat-icon> Nuevo Proyecto
        </button>
        <button mat-stroked-button (click)="cerrarSesion()">
          <mat-icon>logout</mat-icon> Salir
        </button>
      </div>
    </div>
  </mat-card>

  <mat-card *ngIf="showForm" class="form-card">
    <h3>Nuevo Proyecto</h3>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput [(ngModel)]="nuevoProyecto.nombre">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descripción</mat-label>
      <input matInput [(ngModel)]="nuevoProyecto.descripcion">
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="crearProyecto()">Crear</button>
    <button mat-button (click)="showForm = false">Cancelar</button>
  </mat-card>

  <div class="projects-grid">
    <mat-card *ngFor="let project of projects" class="project-card" (click)="abrirBoard(project)">
      <mat-card-header>
        <mat-card-title>{{ project.nombre }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{ project.descripcion }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary">
          <mat-icon>dashboard</mat-icon> Abrir tablero
        </button>
      </mat-card-actions>
    </mat-card>
  </div>

  <div *ngIf="projects.length === 0" class="empty-state">
    <mat-icon>folder_open</mat-icon>
    <p>No tenés proyectos todavía. ¡Creá uno!</p>
  </div>
</div>
